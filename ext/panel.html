<!doctype html>
<meta charset="utf-8">
<title>min</title>
<style>
:root { --bg: #fff; --fg: #111; --mu: #8a8a8e; --bu: #f2f2f4; --li: #e8e8ea; color-scheme: light dark }
@media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #f2f2f2; --mu: #8e8e93; --bu: #26262a; --li: #2c2c30 } }
* { box-sizing: border-box; margin: 0 }
[hidden] { display: none !important }
html, body { height: 100% }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, system-ui, sans-serif }
#log { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 8px }
.u { align-self: flex-end; max-width: 85%; background: var(--bu); padding: 7px 11px; border-radius: 14px; white-space: pre-wrap }
.m { max-width: 92%; white-space: pre-wrap }
.s { color: var(--mu); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.live { animation: p 1.2s ease-in-out infinite }
@keyframes p { 50% { opacity: .35 } }
.hint { color: var(--mu); margin: auto }
footer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--li) }
textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; color: inherit; font: inherit; max-height: 120px; padding: 4px 0 }
#go { flex: none; border: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 14px; cursor: pointer }
#go:disabled { opacity: .25; cursor: default }
#gear { flex: none; border: 0; height: 28px; background: none; color: var(--mu); font-size: 16px; cursor: pointer }
form { display: grid; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--li) }
form input { border: 1px solid var(--li); border-radius: 8px; padding: 6px 8px; background: none; color: inherit; font: inherit }
form button { justify-self: start; border: 0; border-radius: 8px; padding: 5px 12px; background: var(--fg); color: var(--bg); font: inherit; cursor: pointer }
form small { color: var(--mu) }
.row { display: flex; gap: 8px }
.bad { color: #c0453a }
#new { background: none; color: var(--mu); border: 1px solid var(--li) }
</style>
<form id="set" hidden>
  <input id="url" placeholder="llm url (openai compatible)" autocomplete="off">
  <input id="model" placeholder="model" autocomplete="off">
  <input id="key" type="password" placeholder="key" autocomplete="off">
  <input id="extra" placeholder='extra params, json: {"reasoning_effort":"low"}' autocomplete="off">
  <div class="row"><button>save</button><button id="new" type="button">new chat</button></div>
  <small id="note"></small>
</form>
<main id="log"><p class="hint">tell me what to do in your tabs</p></main>
<footer>
  <button id="gear" title="settings">⋯</button>
  <textarea id="in" rows="1" placeholder="what should i do?"></textarea>
  <button id="go" title="send">↑</button>
</footer>
<script src="page.js"></script>
<script src="panel.js"></script>
